# Deploy of one environment (prumo AMB-02 and AMB-03), from the prumo example (the play-x9 shape),
# adapted to the Zikaron Worker. Called by staging.yml (staging, the commit of each green CI on
# main) and by producao.yml (producao, the release tag's commit). Publishes apps/server with
# `wrangler deploy --env <environment>` and waits for /health to answer with the environment and
# the commit.
#
# The repo is public and the log of every step shows the `env:` block. So, unlike the example:
# - everything that identifies the account, Access, the clients, the App or the Worker's address
#   arrives as an environment secret, which the log masks; only VAULT_REPOSITORY is a variable;
# - the address is neither an input nor `environment.url`, which the public Deployments page would
#   show: it comes from the STAGING_URL or PRODUCAO_URL secret, and is masked before wrangler
#   prints it.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      # The full sha to publish. Empty publishes the run's own commit. Staging passes the commit of
      # the CI that finished, and production the tag's: in a Run workflow, the run's commit is the
      # tip of main.
      ref:
        type: string
        default: ""
    # By name, not with `secrets: inherit`. Inside the job, which declares the environment, the
    # environment secret with the same name applies: the staging token does not reach production
    # (SEG-12).
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      ZIKARON_GITHUB_APP_ID:
        required: false
      ZIKARON_GITHUB_INSTALLATION_ID:
        required: false
      ACCESS_TEAM_DOMAIN:
        required: false
      ACCESS_AUD:
        required: false
      ZIKARON_CLIENTS:
        required: false
      # Each environment's Worker address, exactly as wrangler prints it.
      STAGING_URL:
        required: false
      PRODUCAO_URL:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publish and check /health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    # One deploy at a time per environment; the one running always finishes.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      DEPLOY_SHA: ${{ inputs.ref || github.sha }}
    steps:
      # Production only. A "Re-run failed jobs" runs this job again without the producao.yml gate:
      # the owner check repeats here, and production always publishes a tag's commit.
      - name: Production requested by an owner, at a tag's commit
        if: inputs.environment == 'producao'
        env:
          DONOS: ${{ vars.PRUMO_DONOS }}
          ATOR: ${{ github.triggering_actor }}
          REF: ${{ inputs.ref }}
        run: |
          if ! tr -s ',[:blank:]' '\n' <<<"$DONOS" | grep -qixF -- "$ATOR"; then
            echo "$ATOR is not in the PRUMO_DONOS variable: only an owner publishes production." >&2
            exit 1
          fi
          if [ -z "$REF" ]; then
            echo "Production publishes a tag's commit, and the ref came empty." >&2
            exit 1
          fi
      # Without the token and the account, it ends green with a warning and publishes nothing. With
      # them, the Worker's address has to exist: it carries the account's subdomain, and wrangler
      # prints it. The mask holds for the rest of the job, wrangler and /health included.
      - name: Token, account and Worker address
        id: pronto
        env:
          TEM_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          WORKER_URL: ${{ inputs.environment == 'producao' && secrets.PRODUCAO_URL || secrets.STAGING_URL }}
          URL_NOME: ${{ inputs.environment == 'producao' && 'PRODUCAO_URL' || 'STAGING_URL' }}
        run: |
          if [ "$TEM_TOKEN" != true ]; then
            echo "::warning::The $DEPLOY_ENV environment has no CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID yet: nothing was published."
            echo "publica=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          url=${WORKER_URL%/}
          # The address has to be exactly what wrangler will print, or the mask does not catch it.
          worker=zikaron doc=docs/production.md
          if [ "$DEPLOY_ENV" = staging ]; then worker=zikaron-staging doc=docs/staging.md; fi
          if ! [[ "$url" =~ ^https://${worker}\.([a-z0-9-]+)\.workers\.dev$ ]]; then
            echo "The $URL_NOME secret of the $DEPLOY_ENV environment is missing or is not https://$worker.<subdomain>.workers.dev: nothing was published, so the address does not go out unmasked in the log ($doc)." >&2
            exit 1
          fi
          echo "::add-mask::$url"
          echo "::add-mask::${url#https://}"
          echo "::add-mask::${BASH_REMATCH[1]}"
          echo "publica=true" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pronto.outputs.publica == 'true'
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.pronto.outputs.publica == 'true'
      # The token reaches only this step, not the install or the actions. An empty variable stays
      # out: the empty value in wrangler.jsonc applies, and the vault or the identity stay off until
      # it exists. ZIKARON_ENV and ZIKARON_COMMIT are what /health returns (AMB-03).
      - name: wrangler deploy --env ${{ inputs.environment }}
        if: steps.pronto.outputs.publica == 'true'
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_APP_ID: ${{ secrets.ZIKARON_GITHUB_APP_ID }}
          GITHUB_INSTALLATION_ID: ${{ secrets.ZIKARON_GITHUB_INSTALLATION_ID }}
          VAULT_REPOSITORY: ${{ vars.VAULT_REPOSITORY }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          ZIKARON_CLIENTS: ${{ secrets.ZIKARON_CLIENTS }}
        run: |
          args=(--var "ZIKARON_ENV:$DEPLOY_ENV" --var "ZIKARON_COMMIT:$DEPLOY_SHA")
          for name in GITHUB_APP_ID GITHUB_INSTALLATION_ID VAULT_REPOSITORY ACCESS_TEAM_DOMAIN ACCESS_AUD ZIKARON_CLIENTS; do
            if [ -n "${!name}" ]; then args+=(--var "$name:${!name}"); fi
          done
          # On an authentication error, wrangler prints the email and the accounts the token sees,
          # unmasked: the output goes to a file, and the public log only carries the error code.
          log="$RUNNER_TEMP/wrangler.log"
          if ./node_modules/.bin/wrangler deploy --env "$DEPLOY_ENV" "${args[@]}" >"$log" 2>&1; then
            cat "$log"
          else
            code=$(grep -oE '\[code: [0-9]+\]' "$log" | head -1 || true)
            echo "wrangler deploy failed ${code:-with no code}; its output stays out of the public log." >&2
            exit 1
          fi
      # /health sits behind an Access bypass (docs/staging.md and docs/production.md).
      - name: Check /health
        if: steps.pronto.outputs.publica == 'true'
        env:
          WORKER_URL: ${{ inputs.environment == 'producao' && secrets.PRODUCAO_URL || secrets.STAGING_URL }}
        run: .github/scripts/check-health.sh "${WORKER_URL%/}/health" "$DEPLOY_ENV" "$DEPLOY_SHA"
