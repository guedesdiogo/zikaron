name: Staging

# Publishes zikaron-staging after CI passes on a push to main (Story 1.8), through deploy.yml, which
# checks /health at the end. What stops a PR, from a fork or not, is the job's `if`: only a push to
# this repository. The `staging` environment only accepts main, but in a workflow_run the ref is
# always the default branch, so it is not the barrier.
#
# The repo is public and the log of every step shows the `env:` block: everything that identifies
# the account, Access, the clients or the Worker's address is an environment secret, which the log
# masks, and deploy.yml masks STAGING_URL before wrangler prints it. The secrets go by name: inside
# the deploy.yml job, which declares the environment, the environment's value applies.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Not `deploy-staging`: that is the group of the deploy.yml job.
concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Staging deploy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      # The commit CI checked; in a workflow_run, github.sha is the tip of main.
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZIKARON_GITHUB_APP_ID: ${{ secrets.ZIKARON_GITHUB_APP_ID }}
      ZIKARON_GITHUB_INSTALLATION_ID: ${{ secrets.ZIKARON_GITHUB_INSTALLATION_ID }}
      ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
      ZIKARON_CLIENTS: ${{ secrets.ZIKARON_CLIENTS }}
      STAGING_URL: ${{ secrets.STAGING_URL }}
