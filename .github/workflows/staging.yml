name: Staging

# Publica o zikaron-staging depois que o CI passa num push na main (Story 1.8), pelo deploy.yml, que
# confere o /health no fim. O que barra um PR, de fork ou não, é o `if` do job: só um push deste
# repositório. O environment `staging` só aceita a main, mas num workflow_run o ref é sempre a
# branch padrão, então ele não é a barreira.
#
# O repo é público e o log de cada passo mostra o bloco `env:`: tudo o que identifica a conta, o
# Access, os clientes ou o endereço do Worker é segredo do environment, que o log mascara, e o
# deploy.yml mascara o STAGING_URL antes de o wrangler imprimi-lo. Os segredos vão por nome: dentro
# do job do deploy.yml, que declara o environment, vale o valor do environment.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Não `deploy-staging`: é o grupo do job do deploy.yml.
concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy do staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      # O commit que o CI conferiu; num workflow_run, o github.sha é a ponta da main.
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZIKARON_GITHUB_APP_ID: ${{ secrets.ZIKARON_GITHUB_APP_ID }}
      ZIKARON_GITHUB_INSTALLATION_ID: ${{ secrets.ZIKARON_GITHUB_INSTALLATION_ID }}
      ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
      ZIKARON_CLIENTS: ${{ secrets.ZIKARON_CLIENTS }}
      STAGING_URL: ${{ secrets.STAGING_URL }}
