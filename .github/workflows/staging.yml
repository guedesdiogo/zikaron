name: Staging

# Publica o zikaron-staging depois que o CI passa num push na main (Story 1.8). Só a main chega
# aqui: o workflow_run roda no contexto da branch padrão, e o environment `staging` só aceita a
# main. Nenhum PR, de fork ou não, alcança o token do Cloudflare.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy do staging
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: wrangler deploy --env staging
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_APP_ID: ${{ vars.ZIKARON_GITHUB_APP_ID }}
          GITHUB_INSTALLATION_ID: ${{ vars.ZIKARON_GITHUB_INSTALLATION_ID }}
          VAULT_REPOSITORY: ${{ vars.VAULT_REPOSITORY }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          ZIKARON_CLIENTS: ${{ vars.ZIKARON_CLIENTS }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::O environment staging ainda não tem CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID: nada foi publicado (issue #12)."
            exit 0
          fi
          # Uma variável vazia fica de fora: vale o vazio do wrangler.jsonc, e o cofre ou a
          # identidade ficam desligados até ela existir.
          args=()
          for name in GITHUB_APP_ID GITHUB_INSTALLATION_ID VAULT_REPOSITORY ACCESS_TEAM_DOMAIN ACCESS_AUD ZIKARON_CLIENTS; do
            if [ -n "${!name}" ]; then args+=(--var "$name:${!name}"); fi
          done
          ./node_modules/.bin/wrangler deploy --env staging "${args[@]}"
