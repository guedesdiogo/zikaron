# Production by release (prumo AMB-05 and D21), from the prumo example (the play-x9 shape). The
# step by step and what the owner creates beforehand are in docs/production.md.
#
# Production goes out when the owner asks, as a GitHub release: publishing the vX.Y.Z release
# publishes its tag's commit. A pre-release publishes nothing. The agent creates the release with
#   .github/scripts/producao.sh release <patch|minor|major|vX.Y.Z> --publicar
# (a production deploy: only with the owner's order in the turn; git-guard F checks it). Rolling
# back, or forcing the `critico` lock, is a Run workflow from main with the tag:
#   gh workflow run producao.yml --ref main -f tag=v0.1.0
#
# Repo variables: PRUMO_DONOS (who requests production, comma-separated) and PRUMO_MENTOR (who
# gives the «Aceite», default guedesdiogo). In the producao environment, which accepts deploys only
# from main and the v* tags: the VAULT_REPOSITORY variable and the deploy.yml secrets, with
# PRODUCAO_URL in place of STAGING_URL. The repo is public: the Worker's address is a secret, never
# a variable.

# producao.sh reads the tag in production from the name of the last green run, so the «Produção»
# prefix stays as it is. A pre-release run skips every job, so it carries another name and never
# counts as production.
run-name: ${{ github.event.release.prerelease && 'Pre-release' || 'Produção' }} ${{ github.event.release.tag_name || inputs.tag }}
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        type: string
        required: true
      forcar:
        description: Publishes even with a `critico` issue without the mentor's «Aceite» (an owner only, with the reason)
        type: boolean
        default: false
      motivo:
        description: Why force
        type: string
        default: ""

permissions:
  contents: read

# One production run at a time, and the one running always finishes. Not `deploy-producao`: that is
# the group of the deploy.yml job, and a workflow that shares the group with one of its own jobs
# deadlocks. A pre-release has a group of its own, so it never takes a production run's place in
# the queue.
concurrency:
  group: ${{ github.event.release.prerelease && format('pre-{0}', github.run_id) || 'producao' }}
  cancel-in-progress: false

jobs:
  # Fails the run instead of skipping it, so a refused request never looks like a deploy. Only the
  # pre-release is skipped: publishing it does not ask for production. The inputs and the event
  # data reach the scripts only through env, never inside them.
  gate:
    name: Check the release
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # Whoever published the release or clicked Run workflow; on a re-run, whoever ran it again.
      - name: The requester is an owner
        env:
          DONOS: ${{ vars.PRUMO_DONOS }}
          ATOR: ${{ github.triggering_actor }}
        run: |
          if ! tr -s ',[:blank:]' '\n' <<<"$DONOS" | grep -qixF -- "$ATOR"; then
            echo "$ATOR is not in the PRUMO_DONOS variable: only an owner requests production." >&2
            exit 1
          fi
      - name: Run workflow only from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "The production Run workflow goes out from main, and this one came from $GITHUB_REF." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The tag decides what goes out, so rolling back is the same run with an older tag. The green
      # CI is that of the push to main. Here staging is another workflow (staging.yml), which
      # publishes after each green CI on main and is not part of this check: it does not prove that
      # staging received the commit (AMB-04), only that its CI passed.
      - name: Published release, on main, with green CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          FORCAR: ${{ inputs.forcar }}
          MOTIVO: ${{ inputs.motivo }}
          ATOR: ${{ github.triggering_actor }}
        run: |
          if [ "$FORCAR" = true ] && [ -z "${MOTIVO//[[:space:]]/}" ]; then
            echo "Forcing requires the reason." >&2
            exit 1
          fi
          # Until it matches, the tag is free text and stays out of the log: the runner reads «::» lines as commands.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag must be vX.Y.Z." >&2
            exit 1
          fi
          if ! publicada=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '(.draft or .prerelease) | not'); then
            echo "$TAG is not a GitHub release's tag." >&2
            exit 1
          fi
          if [ "$publicada" != true ]; then
            echo "The $TAG release is a draft or a pre-release: it does not go to production." >&2
            exit 1
          fi
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "The commit $sha of $TAG is not on main." >&2
            exit 1
          fi
          verdes=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&branch=main&event=push&status=success&per_page=1" --jq .total_count)
          if ! [ "${verdes:-0}" -ge 1 ] 2>/dev/null; then
            echo "The main CI did not pass on the commit $sha of $TAG." >&2
            exit 1
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "Production: $TAG, commit \`$sha\`, requested by $ATOR." >>"$GITHUB_STEP_SUMMARY"

  # A release that brings a `critico` issue without the mentor's «Aceite» stops here, before the
  # deploy, and the run summary lists the issues (KAN-14). The range starts at the tag in
  # production, so a release that stopped keeps stopping the following ones. An issue whose PR the
  # mentor opened counts as accepted. With `forcar`, an owner publishes anyway: the issues get the
  # «Aceite forçado» comment and the mentor, a retroactive review issue.
  trava:
    name: Critico lock
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Critico issues with the mentor's Aceite
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRUMO_MENTOR: ${{ vars.PRUMO_MENTOR || 'guedesdiogo' }}
          TAG: ${{ needs.gate.outputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
          FORCAR: ${{ inputs.forcar }}
          MOTIVO: ${{ inputs.motivo }}
        # The range ends at the sha the gate read, the one to be published; the tag only shows up.
        run: |
          if [ "$FORCAR" = true ]; then
            .github/scripts/producao.sh forcar "$TAG" "$SHA" "$MOTIVO"
          else
            .github/scripts/producao.sh trava "$TAG" "$SHA"
          fi

  # The secrets go by name: inside the deploy.yml job, which declares the producao environment,
  # the environment's value applies, never staging's.
  producao:
    name: Production
    needs: [gate, trava]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: producao
      ref: ${{ needs.gate.outputs.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZIKARON_GITHUB_APP_ID: ${{ secrets.ZIKARON_GITHUB_APP_ID }}
      ZIKARON_GITHUB_INSTALLATION_ID: ${{ secrets.ZIKARON_GITHUB_INSTALLATION_ID }}
      ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
      ZIKARON_CLIENTS: ${{ secrets.ZIKARON_CLIENTS }}
      PRODUCAO_URL: ${{ secrets.PRODUCAO_URL }}
