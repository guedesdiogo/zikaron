# Produção por release (prumo AMB-05 e D21), do exemplo do prumo (forma do play-x9). O passo a
# passo e o que o dono cria antes estão no docs/producao.md.
#
# A produção sai quando o dono pede, como uma release do GitHub: publicar a release vX.Y.Z
# publica o commit da tag dela. Uma pré-release não publica nada. O agente cria a release com
#   .github/scripts/producao.sh release <patch|minor|major|vX.Y.Z> --publicar
# (deploy de produção: só com a ordem do dono no turno; o git-guard F confere). Voltar atrás, ou
# forçar a trava do `critico`, é um Run workflow da main com a tag:
#   gh workflow run producao.yml --ref main -f tag=v0.1.0
#
# Variáveis do repo: PRUMO_DONOS (quem pede a produção, separados por vírgula) e PRUMO_MENTOR (quem
# dá o «Aceite», padrão guedesdiogo). No environment producao, que aceita deploy só da main e das
# tags v*: a variável VAULT_REPOSITORY e os segredos do deploy.yml, com o PRODUCAO_URL no lugar do
# STAGING_URL. O repo é público: o endereço do Worker é segredo, nunca variável.

# O producao.sh lê a tag que está em produção pelo nome do último run verde. O run de uma
# pré-release pula todos os jobs, por isso leva outro nome e nunca conta como produção.
run-name: ${{ github.event.release.prerelease && 'Pré-release' || 'Produção' }} ${{ github.event.release.tag_name || inputs.tag }}
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da release (vX.Y.Z)
        type: string
        required: true
      forcar:
        description: Publica mesmo com issue `critico` sem o «Aceite» do mentor (só um dono, com o motivo)
        type: boolean
        default: false
      motivo:
        description: Por que forçar
        type: string
        default: ""

permissions:
  contents: read

# Um run de produção por vez, e o que está rodando sempre termina. Não `deploy-producao`: é o grupo
# do job do deploy.yml, e um workflow que divide o grupo com um job dele mesmo trava. Uma
# pré-release tem um grupo só dela, para nunca tomar o lugar de um run de produção na fila.
concurrency:
  group: ${{ github.event.release.prerelease && format('pre-{0}', github.run_id) || 'producao' }}
  cancel-in-progress: false

jobs:
  # Falha o run em vez de pulá-lo, para um pedido recusado nunca parecer um deploy. Só a
  # pré-release é pulada: publicá-la não pede produção. As entradas e os dados do evento chegam
  # aos scripts só pelo env, nunca dentro deles.
  gate:
    name: Confere a release
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # Quem publicou a release ou clicou em Run workflow; num re-run, quem rodou de novo.
      - name: Quem pediu é dono
        env:
          DONOS: ${{ vars.PRUMO_DONOS }}
          ATOR: ${{ github.triggering_actor }}
        run: |
          if ! tr -s ',[:blank:]' '\n' <<<"$DONOS" | grep -qixF -- "$ATOR"; then
            echo "$ATOR não está na variável PRUMO_DONOS: só um dono pede a produção." >&2
            exit 1
          fi
      - name: Run workflow só da main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "O Run workflow da produção sai da main, e este veio de $GITHUB_REF." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A tag decide o que sai, então voltar atrás é o mesmo run com uma tag mais velha. O CI verde
      # é o do push na main. Aqui o staging é outro workflow (staging.yml), que publica depois de
      # cada CI verde da main e não entra nesta conferência: ela não prova que o staging recebeu o
      # commit (AMB-04), só que o CI dele passou.
      - name: Release publicada, na main e com o CI verde
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          FORCAR: ${{ inputs.forcar }}
          MOTIVO: ${{ inputs.motivo }}
          ATOR: ${{ github.triggering_actor }}
        run: |
          if [ "$FORCAR" = true ] && [ -z "${MOTIVO//[[:space:]]/}" ]; then
            echo "Forçar exige o motivo." >&2
            exit 1
          fi
          # Até casar, a tag é texto livre e não vai para o log: o runner lê linhas «::» como comandos.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A tag precisa ser vX.Y.Z." >&2
            exit 1
          fi
          if ! publicada=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '(.draft or .prerelease) | not'); then
            echo "A $TAG não é de uma release do GitHub." >&2
            exit 1
          fi
          if [ "$publicada" != true ]; then
            echo "A release $TAG é rascunho ou pré-release: não vai para a produção." >&2
            exit 1
          fi
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "O commit $sha da $TAG não está na main." >&2
            exit 1
          fi
          verdes=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&branch=main&event=push&status=success&per_page=1" --jq .total_count)
          if ! [ "${verdes:-0}" -ge 1 ] 2>/dev/null; then
            echo "O CI da main não passou no commit $sha da $TAG." >&2
            exit 1
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "Produção: $TAG, commit \`$sha\`, pedida por $ATOR." >>"$GITHUB_STEP_SUMMARY"

  # Uma release que traz issue `critico` sem o «Aceite» do mentor para aqui, antes do deploy, e o
  # resumo do run lista as issues (KAN-14). O intervalo começa na tag que está em produção, então
  # uma release que parou continua parando as seguintes. Conta como aceita a issue cujo PR o
  # próprio mentor abriu. Com `forcar`, um dono publica mesmo assim: as issues recebem o
  # comentário «Aceite forçado» e o mentor, uma issue de revisão retroativa.
  trava:
    name: Trava do critico
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Issues critico com o Aceite do mentor
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRUMO_MENTOR: ${{ vars.PRUMO_MENTOR || 'guedesdiogo' }}
          TAG: ${{ needs.gate.outputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
          FORCAR: ${{ inputs.forcar }}
          MOTIVO: ${{ inputs.motivo }}
        # O intervalo termina no sha que o gate leu, o que vai ser publicado; a tag só aparece.
        run: |
          if [ "$FORCAR" = true ]; then
            .github/scripts/producao.sh forcar "$TAG" "$SHA" "$MOTIVO"
          else
            .github/scripts/producao.sh trava "$TAG" "$SHA"
          fi

  # Os segredos vão por nome: dentro do job do deploy.yml, que declara o environment producao,
  # vale o valor do environment, nunca o do staging.
  producao:
    name: Produção
    needs: [gate, trava]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: producao
      ref: ${{ needs.gate.outputs.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZIKARON_GITHUB_APP_ID: ${{ secrets.ZIKARON_GITHUB_APP_ID }}
      ZIKARON_GITHUB_INSTALLATION_ID: ${{ secrets.ZIKARON_GITHUB_INSTALLATION_ID }}
      ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
      ZIKARON_CLIENTS: ${{ secrets.ZIKARON_CLIENTS }}
      PRODUCAO_URL: ${{ secrets.PRODUCAO_URL }}
