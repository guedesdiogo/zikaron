name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The repo is public: every job runs on GitHub runners, with no secrets and no pull_request_target,
# so a fork's PR never runs on a machine of ours or reads a secret (CLAUDE.md, "Limits").
jobs:
  checks:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run lint
      - run: bun run typecheck
      # The tests, once, with coverage: each workspace fails below its own floor.
      - run: bun run test:coverage

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint runs shellcheck, which the runner already has, on every run: block.
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # The only check the main ruleset requires: a new gate does not change the ruleset.
  ci-passed:
    name: CI passed
    if: always()
    needs: [checks, workflows, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Every gate passes; only the dependency review may skip, outside a PR.
      - name: All gates passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e --arg event "$EVENT" '
            to_entries | all(.value.result == "success" or
              (.value.result == "skipped" and .key == "dependency-review" and $event != "pull_request"))
          ' <<< "$NEEDS" > /dev/null
